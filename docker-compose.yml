services:
  backend:
    build:
      context: .
      target: backend
    image: enterprise-rag-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - rag_data:/app/data
      - rag_backups:/app/backups
      - model_cache:/app/model_cache
    expose:
      - "8000"
    healthcheck:
      # 使用内置 Python 探测 /api/ready，无需额外工具
      test: >
        python -c "
        import urllib.request, sys;
        try:
          r = urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5);
          sys.exit(0 if r.status < 400 else 1)
        except Exception:
          sys.exit(1)
        "
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次启动需下载模型，给足时间
      start_period: 120s

  nginx:
    build:
      context: .
      target: nginx
    image: enterprise-rag-nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 生产 HTTPS：挂载证书目录（宿主机 ./certs/ 需包含 fullchain.pem + privkey.pem）
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  # ── 监控栈（启用：docker compose --profile monitoring up -d）──────────────────

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    environment:
      - METRICS_TOKEN=${METRICS_TOKEN}
    volumes:
      - ./monitoring/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    expose:
      - "9090"

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    expose:
      - "9093"

  wechat-webhook:
    profiles: [monitoring]
    build:
      context: ./monitoring/wechat_webhook
    environment:
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    expose:
      - "5001"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  rag_data:
  rag_backups:
  model_cache:
  prometheus_data:
  alertmanager_data:
  grafana_data:
