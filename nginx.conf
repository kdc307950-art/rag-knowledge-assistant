# nginx 反向代理配置（生产 HTTPS）
#
# 证书由宿主机 ./certs 挂载到 /etc/nginx/certs（见 docker-compose.yml）：
#   certs/fullchain.pem   证书链
#   certs/privkey.pem     私钥
# 两个文件缺失时 nginx 会启动失败——这是刻意的：生产不允许静默降级到明文 HTTP。
# 本地验收可用自签证书：bash scripts/gen_dev_certs.sh

# ── HTTP：只保留 ACME 续期路径，其余一律 301 到 HTTPS ────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt http-01 续期；未使用 certbot 时该目录为空，不影响跳转
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：唯一的应用入口 ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # AUTH_COOKIE_SECURE=1 的前提：浏览器后续只走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # 前端 SPA 静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 业务上限是 200 MiB；额外 10 MiB 只容纳 multipart 边界和请求头。
    # 真正的文件/批次限制仍由后端执行，避免合法的边界请求被 nginx 提前 413。
    client_max_body_size 210m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 就绪探针只供容器健康检查或受控内网监督，不经公网入口暴露。
    location = /api/live {
        return 404;
    }

    location = /api/ready {
        return 404;
    }

    # 后端 API 反代（含 SSE 流式）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：禁用缓冲，保持连接直到客户端断开
        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   300s;
        proxy_http_version   1.1;
        proxy_set_header     Connection "";

        # 大文件上传：不缓冲请求体，交由后端分块落盘
        proxy_request_buffering off;
        proxy_send_timeout      300s;
    }

    # /metrics 不暴露到公网（由 Prometheus 走容器网络 scrape）
    location /metrics {
        deny all;
    }
}
