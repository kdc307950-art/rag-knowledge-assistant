# nginx 反向代理配置
# 生产环境启用 HTTPS 时：取消 server 443 块的注释，补充证书路径，
# 并在 server 80 块中删除 location 段、改为 return 301 https://$host$request_uri。

server {
    listen 80;
    server_name _;

    # 前端 SPA 静态文件
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（含 SSE 流式）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：禁用缓冲，保持连接直到客户端断开
        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   300s;
        proxy_http_version   1.1;
        proxy_set_header     Connection "";
    }

    # /metrics 不暴露到公网（由 Prometheus 内网 scrape）
    location /metrics {
        deny all;
    }
}

