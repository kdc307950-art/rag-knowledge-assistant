global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: enterprise-rag

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: rag
    metrics_path: /metrics
    # Prometheus 发送 Authorization: Bearer <token>，后端同时支持 X-Metrics-Token
    # 路径需与 entrypoint.sh 的 TOKEN_FILE 一致（用 /tmp：镜像以 nobody 运行，写不了 /run）
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
